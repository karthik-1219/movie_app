name: Backend Continuous Deployment

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-cd.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: python -m pip install --upgrade pip pipenv
      - run: pipenv install --dev --skip-lock
      - run: pipenv run lint

  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: python -m pip install --upgrade pip pipenv
      - run: pipenv install --dev --skip-lock
      - run: pipenv run test

  build-and-push:
    runs-on: ubuntu-latest
    needs: [lint, test]
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - id: login-ecr
        name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: echo "image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        working-directory: backend
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: azure/setup-kubectl@v4
      - uses: imranismail/setup-kustomize@v2
      - run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
      - name: Apply backend manifests
        working-directory: backend/k8s
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          kustomize edit set image backend="$IMAGE"
          kustomize build . | kubectl apply -f -
          kubectl rollout status deployment/backend --timeout=180s
      - name: Verify backend API
        run: |
          kubectl get service backend -o wide
          kubectl run movie-api-check --rm --restart=Never --image=curlimages/curl:8.10.1 -- curl --fail --silent http://backend:5000/movies
