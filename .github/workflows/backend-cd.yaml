name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    name: Lint Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pipenv
          cache-dependency-path: backend/Pipfile.lock

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Run lint
        run: pipenv run flake8 .

  test:
    name: Test Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pipenv
          cache-dependency-path: backend/Pipfile.lock

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Run tests
        run: pipenv run pytest

  build:
    name: Build Backend
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t movie-app-backend:${{ github.sha }} \
            ./backend

  ecr:
    name: Push Backend Image to ECR
    runs-on: ubuntu-latest
    needs: build
    if: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' && secrets.AWS_REGION != '' && secrets.BACKEND_ECR_REPOSITORY != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate AWS credentials
        id: aws-auth
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws sts get-caller-identity > /tmp/aws-identity.json 2>/tmp/aws-identity.err || {
            echo "aws_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          echo "aws_ok=true" >> "$GITHUB_OUTPUT"

      - name: Skip deployment when AWS credentials are unavailable
        if: steps.aws-auth.outputs.aws_ok != 'true'
        run: echo "Skipping backend deployment because AWS credentials are missing or invalid."

      - name: Configure AWS credentials
        if: steps.aws-auth.outputs.aws_ok == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.aws-auth.outputs.aws_ok == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        if: steps.aws-auth.outputs.aws_ok == 'true'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.BACKEND_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/$REPOSITORY:$IMAGE_TAG \
            ./backend

          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

  deploy:
    name: Deploy Backend to EKS
    runs-on: ubuntu-latest
    needs: ecr
    if: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' && secrets.AWS_REGION != '' && secrets.EKS_CLUSTER_NAME != '' && secrets.BACKEND_ECR_REPOSITORY != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate AWS credentials
        id: aws-auth
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws sts get-caller-identity > /tmp/aws-identity.json 2>/tmp/aws-identity.err || {
            echo "aws_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          echo "aws_ok=true" >> "$GITHUB_OUTPUT"

      - name: Skip deployment when AWS credentials are unavailable
        if: steps.aws-auth.outputs.aws_ok != 'true'
        run: echo "Skipping backend deployment because AWS credentials are missing or invalid."

      - name: Configure AWS credentials
        if: steps.aws-auth.outputs.aws_ok == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.aws-auth.outputs.aws_ok == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configure kubectl
        if: steps.aws-auth.outputs.aws_ok == 'true'
        run: |
          aws eks update-kubeconfig \
            --region "${{ secrets.AWS_REGION }}" \
            --name "${{ secrets.EKS_CLUSTER_NAME }}"

      - name: Apply backend Kubernetes resources
        if: steps.aws-auth.outputs.aws_ok == 'true'
        run: kubectl apply -k backend/k8s

      - name: Update backend image
        if: steps.aws-auth.outputs.aws_ok == 'true'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.BACKEND_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl set image deployment/backend \
            backend=$REGISTRY/$REPOSITORY:$IMAGE_TAG \
            -n default

      - name: Wait for deployment
        if: steps.aws-auth.outputs.aws_ok == 'true'
        run: |
          kubectl rollout status deployment/backend -n default