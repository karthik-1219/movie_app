name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    name: Lint Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    name: Test Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="${{ secrets.REACT_APP_MOVIE_API_URL }}" \
            -t movie-app-frontend:${{ github.sha }} \
            ./frontend

  ecr:
    name: Push Frontend Image to ECR
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate AWS credentials
        id: aws-auth
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws sts get-caller-identity > /tmp/aws-identity.json 2>/tmp/aws-identity.err || {
            echo "aws_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          echo "aws_ok=true" >> "$GITHUB_OUTPUT"

      - name: Skip deployment when AWS credentials are unavailable
        if: steps.aws-auth.outputs.aws_ok != 'true'
        run: echo "Skipping frontend deployment because AWS credentials are missing or invalid."

      - name: Configure AWS credentials
        if: steps.aws-auth.outputs.aws_ok == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.aws-auth.outputs.aws_ok == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        if: steps.aws-auth.outputs.aws_ok == 'true'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.FRONTEND_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="${{ secrets.REACT_APP_MOVIE_API_URL }}" \
            -t $REGISTRY/$REPOSITORY:$IMAGE_TAG \
            ./frontend

          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

  deploy:
    name: Deploy Frontend to EKS
    runs-on: ubuntu-latest
    needs: ecr

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate AWS credentials
        id: aws-auth
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws sts get-caller-identity > /tmp/aws-identity.json 2>/tmp/aws-identity.err || {
            echo "aws_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          echo "aws_ok=true" >> "$GITHUB_OUTPUT"

      - name: Skip deployment when AWS credentials are unavailable
        if: steps.aws-auth.outputs.aws_ok != 'true'
        run: echo "Skipping frontend deployment because AWS credentials are missing or invalid."

      - name: Configure AWS credentials
        if: steps.aws-auth.outputs.aws_ok == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.aws-auth.outputs.aws_ok == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configure kubectl
        if: steps.aws-auth.outputs.aws_ok == 'true'
        run: |
          aws eks update-kubeconfig \
            --region "${{ secrets.AWS_REGION }}" \
            --name "${{ secrets.EKS_CLUSTER_NAME }}"

      - name: Apply frontend Kubernetes resources
        if: steps.aws-auth.outputs.aws_ok == 'true'
        run: kubectl apply -k frontend/k8s

      - name: Update frontend image
        if: steps.aws-auth.outputs.aws_ok == 'true'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.FRONTEND_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl set image deployment/frontend \
            frontend=$REGISTRY/$REPOSITORY:$IMAGE_TAG \
            -n default

      - name: Wait for deployment
        if: steps.aws-auth.outputs.aws_ok == 'true'
        run: |
          kubectl rollout status deployment/frontend -n default