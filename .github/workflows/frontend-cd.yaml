name: Frontend Continuous Deployment

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-cd.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
  REACT_APP_MOVIE_API_URL: ${{ vars.BACKEND_API_URL }}

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/cache@v4
        with:
            path: ~/.npm
            key: frontend-npm-${{ runner.os }}-${{ hashFiles('frontend/package.json') }}
          - run: npm install
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/cache@v4
        with:
            path: ~/.npm
            key: frontend-npm-${{ runner.os }}-${{ hashFiles('frontend/package.json') }}
          - run: npm install
      - run: npm test -- --run

  build-and-push:
    runs-on: ubuntu-latest
    needs: [lint, test]
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - id: login-ecr
        name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: echo "image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        working-directory: frontend
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          docker build --build-arg REACT_APP_MOVIE_API_URL="$REACT_APP_MOVIE_API_URL" --tag "$IMAGE" .
          docker push "$IMAGE"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: azure/setup-kubectl@v4
      - uses: imranismail/setup-kustomize@v2
      - run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
      - name: Apply frontend manifests
        working-directory: frontend/k8s
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          kustomize edit set image frontend="$IMAGE"
          kustomize build . | kubectl apply -f -
          kubectl rollout status deployment/frontend --timeout=180s
      - name: Verify frontend service
        run: kubectl get service frontend -o wide
